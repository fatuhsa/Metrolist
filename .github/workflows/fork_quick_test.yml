name: Fork Quick Test

# Temporary workflow to verify the build on a fork, where the Blacksmith
# runners and release-signing secrets used by the main CI are unavailable.
# Builds the debug APK on a standard GitHub-hosted runner instead.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug:
    name: Build FOSS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary
